services:
  mcp:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8001:8001"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; from urllib.parse import urlparse; prefix=urlparse(os.getenv('RED_TRANSPORTE_MCP_BASE_URL', '')).path.rstrip('/'); urllib.request.urlopen(f'http://127.0.0.1:8001{prefix}/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
